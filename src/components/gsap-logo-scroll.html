<style>
  :root { --bg:#0a0e1a; --cyan:#5ad7fb; --ink:#6b7a99; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg);
    font-family:"JetBrains Mono", ui-monospace, monospace; color:var(--ink); }
  .scroller { } /* full document scrolls */

  .hero, .after { min-height:88vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center; padding:0 24px; }
  .hero { background: radial-gradient(700px 380px at 50% 30%, #121a30 0%, var(--bg) 70%); }
  .eyebrow { font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); opacity:.85; }
  .hero h1 { margin:0; font-weight:600; font-size:clamp(20px,4vw,30px); color:#cfe7f5; letter-spacing:-.01em; }
  .cue { font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.6;
    animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)} }

  .pin-section { height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(900px 540px at 50% 46%, #131c33 0%, var(--bg) 64%); }
  .stage { width:min(560px,90vw); filter: drop-shadow(0 0 30px rgba(90,215,251,.20)); }
  svg { width:100%; height:auto; display:block; overflow:visible; }

  .after { background: linear-gradient(180deg, var(--bg), #0c1424); }
  .after .card { max-width:520px; }
  .after h2 { color:#cfe7f5; font-weight:600; font-size:clamp(18px,3.4vw,24px); margin:0 0 10px; }
  .after p { line-height:1.7; font-size:13px; opacity:.8; margin:0; }
</style>

  <footer class="after">
    <div class="card">
      <h2>...and it's part of the page.</h2>
      <p>The reveal is driven entirely by scroll position. Scroll back up and it rewinds, frame for frame. Drop this section anywhere in the hero and the logo assembles itself as the visitor arrives.</p>

<script>
  gsap.registerPlugin(ScrollTrigger);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const letters = gsap.utils.toArray(".ltr");

  // initial hidden states
  letters.forEach(el => gsap.set(el, { opacity:0, scale:0.55, svgOrigin:`${el.dataset.ox} ${el.dataset.oy}` }));
  gsap.set("#full",     { opacity:0 });
  gsap.set("#halo",     { opacity:0, scale:0.30, y:-50, svgOrigin:"298 43" });
  gsap.set("#sparkles", { opacity:0, scale:0.00, svgOrigin:"347 12" });
  gsap.set("#logo",     { scale:1, svgOrigin:"243 128" });

  if (reduce) {
    // no scrubbing under reduced motion: just show the finished logo
    gsap.set(letters, { opacity:0 });
    gsap.set(["#full","#halo","#sparkles"], { opacity:1, scale:1, y:0 });
  } else {
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".pin-section",
        start: "top top",
        end: "+=1600",     // how much scroll the whole reveal takes
        scrub: 0.8,        // smooth follow; try `true` for 1:1
        pin: true,
      }
    });

    // 1. letters pop in, left to right (scrubbed)
    tl.to(letters, { opacity:1, scale:1, ease:"back.out(2.2)", stagger:0.16, duration:0.4 });
    // 2. swap bands -> seamless wordmark (pixel-identical, invisible)
    tl.set("#full", { opacity:1 }).set(letters, { opacity:0 }, "<");
    // 3. halo drops in
    tl.to("#halo", { opacity:1, scale:1, y:0, ease:"elastic.out(1, 0.5)", duration:1.0 }, "+=0.05");
    // 4. sparkles pop
    tl.to("#sparkles", { opacity:1, scale:1, ease:"back.out(2.5)", duration:0.5 }, "-=0.55");
    // 5. unified settle pulse
    tl.to("#logo", { scale:1.05, duration:0.22, ease:"power2.out" }, "-=0.1")
      .to("#logo", { scale:1,    duration:0.5,  ease:"elastic.out(1, 0.6)" });
  }
</script>
